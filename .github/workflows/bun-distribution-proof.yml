name: Bun distribution proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  committed-dist:
    name: Deterministic dist / Bun 1.3.14
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install production build dependencies
        run: npm ci
      - name: Test the installable app public seams
        run: npm test
      - name: Test accessibility and localization
        run: npm run test:accessibility
      - name: Enforce the read-only security invariant
        run: npm run proof:security
      - name: Type-check production sources
        run: npm run typecheck
      - name: Rebuild committed dist twice
        env:
          BUN_BIN: ${{ steps.bun.outputs.bun-path }}
        run: docs/proofs/fixtures/bun-distribution/check-dist.sh

  package-matrix:
    name: ${{ matrix.architecture }} / Bun ${{ matrix.bun-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            bun-version: 1.3.14
          - runner: macos-15
            architecture: arm64
            bun-version: "1.x"
          - runner: macos-15-intel
            architecture: x86_64
            bun-version: 1.3.14
          - runner: macos-15-intel
            architecture: x86_64
            bun-version: "1.x"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Stage the architecture-neutral plugin package
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          mkdir -p "$RUNNER_TEMP/gitright-proof/package"
          cp -R \
            plugins/gitright/.codex-plugin \
            plugins/gitright/.mcp.json \
            plugins/gitright/dist \
            plugins/gitright/skills \
            "$RUNNER_TEMP/gitright-proof/package/"
          cp docs/proofs/fixtures/bun-distribution/run-package-proof.sh \
            "$RUNNER_TEMP/gitright-proof/run-package-proof.sh"
          cp docs/proofs/fixtures/repository-digest.mjs \
            "$RUNNER_TEMP/gitright-proof/repository-digest.mjs"
          test ! -e "$RUNNER_TEMP/gitright-proof/package/server"
          test ! -e "$RUNNER_TEMP/gitright-proof/package/widget"
          test ! -e "$RUNNER_TEMP/gitright-proof/package/node_modules"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
      - name: Launch the prebuilt payload offline without source or local build
        working-directory: ${{ runner.temp }}/gitright-proof
        env:
          BUN_BIN: ${{ steps.bun.outputs.bun-path }}
          PACKAGE_DIR: ${{ runner.temp }}/gitright-proof/package
          SOURCE_CHECKOUT: ${{ github.workspace }}
          REQUIRE_NO_SOURCE_CHECKOUT: 1
        run: ./run-package-proof.sh
